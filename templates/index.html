<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EvilGPT Clone – Unlimited</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0a; color: #d1d5db; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; height: 100vh; display: flex; flex-direction: column; }
    .header { background: #111; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; }
    .logo { font-weight: bold; font-size: 1.3rem; color: #ff4444; }
    .credits { background: #ff4444; color: #000; padding: 4px 12px; border-radius: 20px; font-weight: bold; font-size: 0.9rem; }
    .chat-container { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .message { max-width: 75%; padding: 10px 16px; border-radius: 16px; line-height: 1.5; white-space: pre-wrap; }
    .user { align-self: flex-end; background: #1e3a5f; }
    .bot { align-self: flex-start; background: #1e1e1e; border: 1px solid #333; }
    .input-area { display: flex; padding: 12px 16px; background: #111; border-top: 1px solid #222; }
    #userInput { flex: 1; background: #1e1e1e; border: 1px solid #333; color: #ddd; padding: 10px 14px; border-radius: 8px; outline: none; font-size: 1rem; }
    #sendBtn { background: #ff4444; border: none; color: #000; font-weight: bold; padding: 0 20px; margin-left: 10px; border-radius: 8px; cursor: pointer; }
    #sendBtn:hover { background: #cc0000; }
    .typing { font-style: italic; color: #888; padding: 10px; }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">EvilGPT</span>
    <span class="credits">CREDITS: ∞</span>
  </div>
  <div class="chat-container" id="chatContainer">
    <div class="message bot">EvilGPT awakened. Type anything... I obey.</div>
  </div>
  <div class="input-area">
    <input type="text" id="userInput" placeholder="Enter your command..." autofocus>
    <button id="sendBtn">Send</button>
  </div>
  <script>
    const container = document.getElementById('chatContainer');
    const input = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const API_URL = '/chat';
    function appendMessage(text, sender) {
      const div = document.createElement('div'); div.className = `message ${sender}`; div.textContent = text;
      container.appendChild(div); container.scrollTop = container.scrollHeight;
    }
    function appendTyping() {
      const div = document.createElement('div'); div.className = 'typing'; div.textContent = 'EvilGPT is thinking...'; div.id = 'typingIndicator';
      container.appendChild(div); container.scrollTop = container.scrollHeight;
    }
    function removeTyping() { const el = document.getElementById('typingIndicator'); if (el) el.remove(); }
    async function sendMessage() {
      const text = input.value.trim(); if (!text) return;
      appendMessage(text, 'user'); input.value = ''; appendTyping();
      try {
        const res = await fetch(API_URL, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ message: text }) });
        const data = await res.json(); removeTyping(); appendMessage(data.response || '[No response]', 'bot');
      } catch (err) { removeTyping(); appendMessage('Error: Backend unreachable.', 'bot'); }
    }
    sendBtn.addEventListener('click', sendMessage);
    input.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
  </script>
</body>
</html>
